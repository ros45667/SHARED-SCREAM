<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shared Scream</title>

    <!-- QR CODE LIBRARY -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


    <style>

        /* =====================================================
           GLOBAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #050505;

            color: white;

            font-family: Arial, Helvetica, sans-serif;
        }


        /* =====================================================
           MAIN GAME AREA
        ===================================================== */

        #gamePage {

            position: relative;

            width: 100vw;
            height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: #050505;
        }


        /* =====================================================
           SHARED SCREAM BACKGROUND
        ===================================================== */

        #backgroundTitle {

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%)
                rotate(-90deg);

            font-size: clamp(80px, 13vw, 230px);

            font-weight: 900;

            letter-spacing: 15px;

            white-space: nowrap;

            color: rgba(255, 255, 255, 0.035);

            pointer-events: none;

            user-select: none;

            z-index: 0;
        }


        /* =====================================================
           GAME AREA
        ===================================================== */

        #gameWrapper {

            position: relative;

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 2;
        }


        /* =====================================================
           GAME CANVAS
        ===================================================== */

        #gameCanvas {

            /*
             * Internal coordinate system
             *
             * IMPORTANT:
             * Keep this at 1200 x 700 because your
             * server uses these coordinates.
             */

            width: 100vw;
            height: 100vh;

            max-width: 100vw;
            max-height: 100vh;

            background: transparent;

            border: none;

            display: block;
        }


        /* =====================================================
           SIDE INDICATORS
        ===================================================== */

        #gameCanvas.side-left {

            border-right:
                2px dashed
                rgba(0, 255, 255, 0.35);
        }


        #gameCanvas.side-right {

            border-left:
                2px dashed
                rgba(0, 255, 255, 0.35);
        }


        /* =====================================================
           SCORE
        ===================================================== */

        #scoreBoard {

            position: absolute;

            top: 22px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 28px;

            font-size: 28px;

            font-weight: 600;

            letter-spacing: 3px;

            pointer-events: none;
        }


        #score1,
        #score2 {

            min-width: 30px;

            text-align: center;
        }


        #scoreDivider {

            opacity: 0.35;

            font-size: 18px;
        }


        /* =====================================================
           SCREEN SIDE LABEL
        ===================================================== */

        #sideLabel {

            position: absolute;

            top: 68px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            font-size: 12px;

            letter-spacing: 4px;

            text-transform: uppercase;

            opacity: 0.45;

            pointer-events: none;
        }


        /* =====================================================
           CONNECTION STATUS
        ===================================================== */

        #status {

            position: absolute;

            top: 20px;
            left: 20px;

            z-index: 20;

            font-size: 13px;

            font-family: monospace;

            opacity: 0.8;
        }


        #status.connected {

            color: #00ff66;
        }


        #status.disconnected {

            color: #ff3333;
        }


        /* =====================================================
           QR CODE PANEL
        ===================================================== */

        #qrSection {

            position: absolute;

            right: 25px;
            bottom: 25px;

            z-index: 30;

            width: 175px;

            padding: 12px;

            background: rgba(255, 255, 255, 0.96);

            color: black;

            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 0 30px
                rgba(0, 255, 255, 0.15);
        }


        #qrSection h3 {

            margin: 0 0 8px;

            font-size: 14px;

            letter-spacing: 1px;
        }


        #qrcode {

            width: 145px;
            height: 145px;

            margin: auto;
        }


        #qrText {

            margin-top: 7px;

            font-size: 9px;

            line-height: 1.3;

            word-break: break-all;

            opacity: 0.65;
        }


        /* =====================================================
           PHONE CONTROLLER
        ===================================================== */

        #controller {

            display: none;

            width: 100vw;
            height: 100vh;

            background: #050505;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 20px;
        }


        #controller h1 {

            font-size: 32px;

            letter-spacing: 3px;
        }


        .controller-info {

            font-size: 20px;
        }


        #phoneStatus {

            font-family: monospace;

            color: #00ff66;
        }


        .control-button {

            width: 80vw;

            max-width: 400px;

            height: 130px;

            font-size: 55px;

            border: none;

            border-radius: 25px;

            background: #181818;

            color: white;

            box-shadow:
                0 0 20px
                rgba(0, 255, 255, 0.2);

            touch-action: none;

            user-select: none;
        }


        .control-button:active {

            background: #00aaaa;

            transform: scale(0.97);
        }


    </style>

</head>


<body>


<!-- =========================================================
     LAPTOP GAME
========================================================= -->

<div id="gamePage">


    <!-- Background watermark -->

    <div id="backgroundTitle">
        SHARED SCREAM
    </div>


    <!-- Connection -->

    <div id="status">
        connecting...
    </div>


    <!-- Side -->

    <div id="sideLabel"></div>


    <!-- Score -->

    <div id="scoreBoard">

        <span id="score1">0</span>

        <span id="scoreDivider">:</span>

        <span id="score2">0</span>

    </div>


    <!-- Game -->

    <div id="gameWrapper">

        <canvas
            id="gameCanvas"
            width="1200"
            height="700">
        </canvas>

    </div>


    <!-- QR -->

    <div id="qrSection">

        <h3>
            📱 PHONE CONTROL
        </h3>

        <div id="qrcode"></div>

        <div id="qrText">
            Scan to control your paddle
        </div>

    </div>


</div>



<!-- =========================================================
     PHONE CONTROLLER
========================================================= -->

<div id="controller">


    <h1>
        SHARED SCREAM
    </h1>


    <div class="controller-info">

        Player
        <span id="phonePlayer">
            1
        </span>

    </div>


    <div id="phoneStatus">
        Connecting...
    </div>


    <button
        class="control-button"
        id="upButton">

        ⬆️

    </button>


    <button
        class="control-button"
        id="downButton">

        ⬇️

    </button>


</div>



<script>


// ============================================================
// URL PARAMETERS
// ============================================================

const params =
    new URLSearchParams(
        window.location.search
    );


const mode =
    params.get("mode");


// ============================================================
// PHONE CONTROLLER
// ============================================================

if (mode === "controller") {


    // Hide laptop game

    document.getElementById(
        "gamePage"
    ).style.display = "none";


    // Show controller

    document.getElementById(
        "controller"
    ).style.display = "flex";


    // --------------------------------------------------------
    // PLAYER
    // --------------------------------------------------------

    let player =
        params.get("player");


    if (player !== "2") {

        player = "1";

    }


    document.getElementById(
        "phonePlayer"
    ).textContent = player;


    // --------------------------------------------------------
    // PHONE WEBSOCKET
    // --------------------------------------------------------

    const phoneStatus =
        document.getElementById(
            "phoneStatus"
        );


    let phoneSocket;


    function connectPhone() {


        phoneSocket =
            new WebSocket(

                `ws://${location.host}/ws/controller-${player}`

            );


        phoneSocket.onopen = function() {

            phoneStatus.textContent =
                "🟢 CONNECTED";

        };


        phoneSocket.onclose = function() {

            phoneStatus.textContent =
                "🔴 DISCONNECTED";

            setTimeout(
                connectPhone,
                1000
            );

        };


        phoneSocket.onerror = function() {

            phoneSocket.close();

        };

    }


    connectPhone();


    // --------------------------------------------------------
    // SEND COMMAND
    // --------------------------------------------------------

    function sendCommand(action) {


        if (

            phoneSocket &&

            phoneSocket.readyState ===
            WebSocket.OPEN

        ) {


            phoneSocket.send(

                JSON.stringify({

                    action: action,

                    player: Number(player)

                })

            );

        }

    }


    // --------------------------------------------------------
    // BUTTONS
    // --------------------------------------------------------

    const upButton =
        document.getElementById(
            "upButton"
        );


    const downButton =
        document.getElementById(
            "downButton"
        );


    // UP

    upButton.addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            sendCommand("up");

        }
    );


    upButton.addEventListener(
        "touchend",
        function(e) {

            e.preventDefault();

            sendCommand("stop");

        }
    );


    // DOWN

    downButton.addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            sendCommand("down");

        }
    );


    downButton.addEventListener(
        "touchend",
        function(e) {

            e.preventDefault();

            sendCommand("stop");

        }
    );


    // Mouse support

    upButton.addEventListener(
        "mousedown",
        () => sendCommand("up")
    );


    upButton.addEventListener(
        "mouseup",
        () => sendCommand("stop")
    );


    downButton.addEventListener(
        "mousedown",
        () => sendCommand("down")
    );


    downButton.addEventListener(
        "mouseup",
        () => sendCommand("stop")
    );

}



// ============================================================
// LAPTOP GAME
// ============================================================

else {


    // --------------------------------------------------------
    // SIDE
    // --------------------------------------------------------

    const side =
        params.get("side") === "right"
            ? "right"
            : "left";


    const myPlayer =
        side === "left"
            ? 1
            : 2;


    // --------------------------------------------------------
    // CANVAS
    // --------------------------------------------------------

    const canvas =
        document.getElementById(
            "gameCanvas"
        );


    const ctx =
        canvas.getContext("2d");


    canvas.classList.add(

        side === "left"
            ? "side-left"
            : "side-right"

    );


    const WIDTH =
        canvas.width;


    const HEIGHT =
        canvas.height;


    // --------------------------------------------------------
    // SIDE LABEL
    // --------------------------------------------------------

    document.getElementById(
        "sideLabel"
    ).textContent =

        side === "left"
            ? "PLAYER 1 • LEFT"
            : "PLAYER 2 • RIGHT";


    // --------------------------------------------------------
    // SERVER STATE
    // --------------------------------------------------------

    let latest = null;


    let xOffset =
        side === "left"
            ? 0
            : WIDTH;


    // --------------------------------------------------------
    // WEBSOCKET
    // --------------------------------------------------------

    const statusEl =
        document.getElementById(
            "status"
        );


    let ws;


    function connect() {


        ws =
            new WebSocket(

                `ws://${location.host}/ws/display-${side}`

            );


        ws.onopen = function() {


            statusEl.textContent =

                `● ONLINE • PLAYER ${myPlayer}`;


            statusEl.className =
                "connected";

        };


        ws.onclose = function() {


            statusEl.textContent =
                "● OFFLINE • RECONNECTING";


            statusEl.className =
                "disconnected";


            setTimeout(
                connect,
                1000
            );

        };


        ws.onerror = function() {

            ws.close();

        };


        ws.onmessage =
            function(event) {


                latest =
                    JSON.parse(
                        event.data
                    );


                if (

                    latest.court &&

                    latest.court.screen_width

                ) {


                    xOffset =

                        side === "left"
                            ? 0
                            : latest.court.screen_width;

                }


                document.getElementById(
                    "score1"
                ).textContent =
                    latest.score.p1;


                document.getElementById(
                    "score2"
                ).textContent =
                    latest.score.p2;

            };

    }


    connect();



    // --------------------------------------------------------
    // SEND KEYBOARD COMMAND
    // --------------------------------------------------------

    function send(action) {


        if (

            ws &&

            ws.readyState ===
            WebSocket.OPEN

        ) {


            ws.send(

                JSON.stringify({

                    action: action,

                    player: myPlayer

                })

            );

        }

    }



    // --------------------------------------------------------
    // KEYBOARD
    // --------------------------------------------------------

    let keys = {};


    document.addEventListener(
        "keydown",
        function(e) {

            keys[e.key] = true;

        }
    );


    document.addEventListener(
        "keyup",
        function(e) {

            keys[e.key] = false;

        }
    );


    function pollKeys() {


        if (

            keys["w"] ||
            keys["W"] ||
            keys["ArrowUp"]

        ) {

            send("up");

        }


        if (

            keys["s"] ||
            keys["S"] ||
            keys["ArrowDown"]

        ) {

            send("down");

        }

    }


    setInterval(

        pollKeys,

        1000 / 30

    );



    // ========================================================
    // DRAW
    // ========================================================

    function draw() {


        // Clear

        ctx.clearRect(

            0,
            0,
            WIDTH,
            HEIGHT

        );


        if (!latest) {

            return;

        }


        // ----------------------------------------------------
        // DATA
        // ----------------------------------------------------

        const paddleSize =
            latest.paddle_size;


        const p1 =
            latest.paddles.p1;


        const p2 =
            latest.paddles.p2;


        const ball =
            latest.ball;


        // ----------------------------------------------------
        // CENTER LINE
        // ----------------------------------------------------

        ctx.strokeStyle =
            "rgba(255,255,255,0.15)";


        ctx.lineWidth = 2;


        ctx.setLineDash([
            12,
            14
        ]);


        ctx.beginPath();


        ctx.moveTo(
            WIDTH / 2,
            0
        );


        ctx.lineTo(
            WIDTH / 2,
            HEIGHT
        );


        ctx.stroke();


        ctx.setLineDash([]);



        // ----------------------------------------------------
        // PADDLES
        // ----------------------------------------------------

        ctx.fillStyle =
            "white";


        // Player 1

        ctx.fillRect(

            p1.x - xOffset,

            p1.y,

            paddleSize.width,

            paddleSize.height

        );


        // Player 2

        ctx.fillRect(

            p2.x - xOffset,

            p2.y,

            paddleSize.width,

            paddleSize.height

        );



        // ----------------------------------------------------
        // BALL
        // ----------------------------------------------------

        ctx.beginPath();


        ctx.arc(

            ball.x - xOffset +
                ball.size / 2,

            ball.y +
                ball.size / 2,

            ball.size / 2,

            0,

            Math.PI * 2

        );


        ctx.fill();



        // ----------------------------------------------------
        // SMALL PLAYER LABEL
        // ----------------------------------------------------

        ctx.font =
            "12px Arial";


        ctx.fillStyle =
            "rgba(255,255,255,0.3)";


        ctx.textAlign =
            "center";


        ctx.fillText(

            side === "left"
                ? "PLAYER 1"
                : "PLAYER 2",

            WIDTH / 2,

            HEIGHT - 20

        );

    }



    // ========================================================
    // GAME LOOP
    // ========================================================

    function loop() {


        draw();


        requestAnimationFrame(
            loop
        );

    }


    loop();


    // ========================================================
    // QR CODE
    // ========================================================

    /*
     * IMPORTANT:
     *
     * location.hostname is used instead of localhost.
     *
     * This allows a phone on the same Wi-Fi network
     * to connect to the laptop.
     */

    const controllerURL =

        `${window.location.protocol}//` +

        `${window.location.hostname}` +

        `${window.location.port
            ? ":" + window.location.port
            : ""}` +

        `/?mode=controller&player=${myPlayer}`;


    new QRCode(

        document.getElementById(
            "qrcode"
        ),

        {

            text: controllerURL,

            width: 145,

            height: 145,

            correctLevel:
                QRCode.CorrectLevel.H

        }

    );


    // Show generated address

    document.getElementById(
        "qrText"
    ).textContent =
        controllerURL;

}

</script>

</body>

</html>
