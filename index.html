<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scream Pong</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 { margin-bottom: 10px; }

        #gameCanvas {
            background: black;
            border: 3px solid white;
        }

        /* Highlight which outer edge the ball can leave from on this screen */
        #gameCanvas.side-left { border-right-style: dashed; border-right-color: #0ff; }
        #gameCanvas.side-right { border-left-style: dashed; border-left-color: #0ff; }

        .instructions {
            margin-top: 15px;
            text-align: center;
            font-size: 18px;
        }

        .score { font-size: 30px; margin-bottom: 10px; }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 14px;
            font-family: monospace;
        }
        #status.connected { color: #0f0; }
        #status.disconnected { color: #f33; }
    </style>
</head>

<body>

    <div id="status">connecting...</div>

    <h1>🎮 SCREAM PONG <span id="sideLabel"></span> 🎮</h1>

    <div class="score">
        <span id="score1">0</span>
        &nbsp;&nbsp;&nbsp;
        <span id="score2">0</span>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="instructions" id="instructions"></div>

    <script>
        // ==========================================
        // SIDE / SCREEN SETUP
        // Which half of the shared court this screen renders.
        // Use ?side=left or ?side=right in the URL.
        // ==========================================
        const params = new URLSearchParams(window.location.search);
        const side = params.get("side") === "right" ? "right" : "left";
        const myPlayer = side === "left" ? 1 : 2;

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        canvas.classList.add(side === "left" ? "side-left" : "side-right");

        const WIDTH = canvas.width;   // this screen's own pixel width
        const HEIGHT = canvas.height;

        document.getElementById("sideLabel").textContent =
            side === "left" ? "(Left Court)" : "(Right Court)";
        document.getElementById("instructions").textContent =
            `Player ${myPlayer} keyboard: W / S or ↑ / ↓  —  ball crosses over to the other laptop's screen`;

        // xOffset converts a WORLD x-coordinate (0..courtWidth) into a
        // LOCAL x-coordinate for drawing on this screen's canvas.
        let xOffset = side === "left" ? 0 : WIDTH;

        // ==========================================
        // LATEST STATE FROM SERVER (authoritative)
        // ==========================================
        let latest = null;

        // ==========================================
        // WEBSOCKET
        // ==========================================
        const statusEl = document.getElementById("status");
        let ws;

        function connect() {
            ws = new WebSocket(`ws://${location.host}/ws/display-${side}`);

            ws.onopen = () => {
                statusEl.textContent = `connected (player ${myPlayer})`;
                statusEl.className = "connected";
            };
            ws.onclose = () => {
                statusEl.textContent = "disconnected — retrying...";
                statusEl.className = "disconnected";
                setTimeout(connect, 1000);
            };
            ws.onerror = () => ws.close();

            ws.onmessage = (event) => {
                latest = JSON.parse(event.data);
                if (latest.court && latest.court.screen_width) {
                    xOffset = side === "left" ? 0 : latest.court.screen_width;
                }
                document.getElementById("score1").textContent = latest.score.p1;
                document.getElementById("score2").textContent = latest.score.p2;
            };
        }

        connect();

        function send(action) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action, player: myPlayer }));
            }
        }

        // ==========================================
        // KEYBOARD — each screen controls its OWN paddle
        // ==========================================
        let keys = {};
        document.addEventListener("keydown", (e) => { keys[e.key] = true; });
        document.addEventListener("keyup", (e) => { keys[e.key] = false; });

        function pollKeys() {
            if (keys["w"] || keys["W"] || keys["ArrowUp"]) send("up");
            if (keys["s"] || keys["S"] || keys["ArrowDown"]) send("down");
        }
        // Send at a modest fixed rate so we don't flood the socket
        setInterval(pollKeys, 1000 / 30);

        // ==========================================
        // DRAW — purely a function of the latest server state
        // ==========================================
        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            if (!latest) return;

            const paddleSize = latest.paddle_size;
            const p1 = latest.paddles.p1;
            const p2 = latest.paddles.p2;
            const ball = latest.ball;

            ctx.fillStyle = "white";

            // Paddle 1 (only actually visible on the left screen; naturally
            // clipped off-canvas on the right screen since its local x < 0)
            ctx.fillRect(p1.x - xOffset, p1.y, paddleSize.width, paddleSize.height);

            // Paddle 2 (only visible on the right screen)
            ctx.fillRect(p2.x - xOffset, p2.y, paddleSize.width, paddleSize.height);

            // Ball — this is what "travels between screens": it's one
            // world-coordinate, each screen just draws its local slice
            ctx.fillRect(ball.x - xOffset, ball.y, ball.size, ball.size);
        }

        function loop() {
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>

</body>
</html>
